.row{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:9px 14px;border-bottom:1px solid var(--line);font-size:14.5px}

const TOTAL=967;
const nav=document.getElementById('nav'), root=document.getElementById('cats');
DATA.forEach(([key,label,emoji,words])=>{
  nav.insertAdjacentHTML('beforeend',`<a href="#${key}">${emoji} ${label} <b>${words.length}</b></a>`);
  const rows=words.map(w=>`<div class="row" data-s="${(w[0]+' '+w[1]).toLowerCase().replace(/"/g,'')}"><span class="f">${w[0]}</span><span class="e">${w[1]}</span></div>`).join('');
  root.insertAdjacentHTML('beforeend',`<section class="cat" id="${key}"><h2>${emoji} ${label} <span class="c">${words.length}</span></h2><div class="grid">${rows}</div><div class="empty">Aucun résultat dans cette catégorie.</div></section>`);
});
document.getElementById('count').textContent=TOTAL+" mots et expressions au total";
const q=document.getElementById('q');
q.addEventListener('input',()=>{
  const v=q.value.toLowerCase().trim();
  let shown=0;
  document.querySelectorAll('.cat').forEach(sec=>{
    let n=0;
    sec.querySelectorAll('.row').forEach(r=>{const hit=!v||r.dataset.s.includes(v);r.style.display=hit?'':'none';if(hit)n++;});
    sec.querySelector('.empty').style.display=(v&&n===0)?'block':'none';
    sec.querySelector('.grid').style.display=(v&&n===0)?'none':'';
    shown+=n;
  });
  document.getElementById('count').textContent=v?shown+" résultat(s)":TOTAL+" mots et expressions au total";
});
</script>
